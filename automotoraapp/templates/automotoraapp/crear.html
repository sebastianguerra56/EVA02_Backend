<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Auto</title>
</head>
<body>
   <h1>Registrar nuevo auto</h1>

    <form method="POST">

        {% csrf_token %}

        <label for="marca">Marca:</label>
        <br>
        <input type="text" id="marca" name="marca" required>
        <br><br>
        <label for="modelo">Modelo:</label>
        <br>
        <input type="text" id="modelo" name="modelo" required>
        <br><br>
        <label for="año">Año:</label>
        <br>
        <input type="number" id="año" name="año" required>
        <br><br>
        <label for="color">Color:</label>
        <br>
        <input type="text" id="color" name="color" required>
        <br><br>
        <label for="precio">Precio:</label>
        <br>
        <input type="number" id="precio" name="precio" required>
        <br><br>
        <label for="kilometraje">Kilometraje:</label>
        <br>
        <input type="number" id="kilometraje" name="kilometraje" required>
        <br><br>
        <label for="tipo_combustible">Tipo de Combustible:</label>
        <br>
        <select id="tipo_combustible" name="tipo_combustible" required>
            <option value="gasolina">Gasolina</option>
            <option value="diesel">Diesel</option>
        </select>
        <br><br>
        <label for="transmision">Transmisión:</label>
        <br>
        <select id="transmision" name="transmision" required>
            <option value="manual">Manual</option>
            <option value="automatica">Automática</option>
        </select>
        <br><br>
        <label for="numero_puertas">Número de Puertas:</label>
        <br>
        <input type="number" id="numero_puertas" name="numero_puertas" required>
        <br><br>
        <label for="fecha_registro">Fecha de Registro:</label>
        <br>
        <input type="date" id="fecha_registro" name="fecha_registro" required>
        <br><br>
        <button type="submit">
            Guardar auto
        </button>

    </form>

    <br>

    <a href="/">Volver al inicio</a>
</body>
</html>
