<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Automotora</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuente deportiva -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #2b2b2b 0%,
                    #161616 45%,
                    #050505 100%
                );

            color: white;
        }

        /* Contenedor */

        .contenedor-login {
            width: 100%;
            max-width: 430px;

            padding: 45px 38px;

            background: rgba(12, 12, 12, 0.95);

            border: 1px solid #333;
            border-radius: 14px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(255, 102, 0, 0.18);
        }

        /* Logo / icono */

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 12px;

            filter: drop-shadow(
                0 4px 8px rgba(255, 102, 0, 0.4)
            );
        }

        /* Título */

        h1 {
            margin-bottom: 10px;

            font-family: "Orbitron", sans-serif;

            font-size: 27px;
            font-weight: 700;

            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;

            color: #ff6600;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.9);
        }

        .subtitulo {
            margin-bottom: 30px;

            text-align: center;

            color: #aaa;

            font-size: 14px;
        }

        /* Formulario */

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 8px;

            color: #ddd;

            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            font-size: 15px;

            color: white;

            background-color: #151515;

            border: 1px solid #444;
            border-radius: 8px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background-color 0.2s;
        }

        input::placeholder {
            color: #777;
        }

        input:hover {
            border-color: #666;
        }

        input:focus {
            background-color: #101010;

            border-color: #ff6600;

            box-shadow:
                0 0 0 3px rgba(255, 102, 0, 0.15),
                0 0 12px rgba(255, 102, 0, 0.25);
        }

        /* Botón */

        .btn-login {
            width: 100%;

            margin-top: 22px;

            padding: 13px;

            font-family: "Orbitron", sans-serif;

            font-size: 15px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 1px;

            color: white;

            background:
                linear-gradient(
                    45deg,
                    #ff6600,
                    #ff3300
                );

            border: none;
            border-radius: 8px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(255, 102, 0, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Mensajes */

        #mensaje {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        #mensaje:empty {
            display: none;
        }

        #mensaje.exito {
            color: #7cff9d;

            background-color:
                rgba(0, 170, 70, 0.15);

            border: 1px solid #238c44;
        }

        #mensaje.error {
            color: #ff7777;

            background-color:
                rgba(200, 0, 0, 0.15);

            border: 1px solid #8c2323;
        }

        /* Línea decorativa */

        .linea-naranja {
            width: 65px;
            height: 3px;

            margin: 15px auto 25px;

            background:
                linear-gradient(
                    90deg,
                    #ff3300,
                    #ff6600
                );

            border-radius: 5px;
        }

        /* Responsive */

        @media (max-width: 480px) {

            body {
                padding: 20px;
            }

            .contenedor-login {
                padding: 35px 25px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor-login">
        <div class="logo">
            🚗
        </div>

        <h1>Automotora</h1>

        <div class="linea-naranja"></div>

        <p class="subtitulo">
            Ingresa tus credenciales para continuar.
        </p>

        <form id="formLogin">

            <label for="username">Usuario:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn-login">Iniciar sesión</button>

        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

    </div>

    <script>
        const formulario = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            mensaje.textContent = '';
            mensaje.className = '';

            try {
                const respuesta = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    sessionStorage.setItem('token', datos.token);

                    mensaje.textContent = 'Inicio de sesión correcto';
                    mensaje.className = 'exito';

                    window.location.href = '/inicio/';
                } else {
                    mensaje.textContent =
                        datos.error || 'Error al iniciar sesión';

                    mensaje.className = 'error';
                }

            } catch (error) {
                mensaje.textContent =
                    'No se pudo conectar con el servidor. Intenta nuevamente.';

                mensaje.className = 'error';
            }
        });
    </script>

</body>
</html>
